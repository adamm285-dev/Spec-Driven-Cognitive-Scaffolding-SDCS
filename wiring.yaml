# Declarative Topology & Subsystem Mesh (The Wiring)
# SPEC-001 Pillar 2 | Mutability: READ-ONLY (Requires SDCS_ALLOW_CONSTITUTIONAL_MUTATION=1)

version: "1.9.0"

subsystems:
  cli:
    path: "src/sdcs/cli.py"
    description: "Main CLI entrypoint orchestrating subcommands and kinetic verifiers."
    allowed_imports:
      - "sdcs.verifier"
      - "sdcs.decay"
      - "sdcs.session"
      - "sdcs.skeleton"
      - "sdcs.repair"
      - "sdcs.router"
      - "sdcs.warehouse"
      - "sdcs.audit"
      - "sdcs.init"
      - "sdcs.watch"
      - "sdcs.graph"
      - "sdcs.hydrate"
      - "sdcs.map"

  verifier:
    path: "src/sdcs/verifier"
    description: "Kinetic enforcement gates: topology, quality, cycles, cache, environment, sandbox."
    allowed_imports: []

  decay:
    path: "src/sdcs/decay.py"
    description: "Staleness decay and decisions graveyard lifecycle engine."
    allowed_imports: []

  skeleton:
    path: "src/sdcs/skeleton.py"
    description: "Polyglot AST skeleton compactor for token-efficient file viewing."
    allowed_imports: []

  repair:
    path: "src/sdcs/repair.py"
    description: "Deterministic pre-flight auto-repair engine executing local formatters."
    allowed_imports: []

  router:
    path: "src/sdcs/router.py"
    description: "Governed model tier escalation router."
    allowed_imports: []

  session:
    path: "src/sdcs/session.py"
    description: "Post-hoc flight recorder and causal lineage logger."
    allowed_imports: []

  warehouse:
    path: "src/sdcs/warehouse.py"
    description: "Cognitive warehouse and Gate W secret sanitizer."
    allowed_imports:
      - "sdcs.verifier"

  watch:
    path: "src/sdcs/watch.py"
    description: "Living Office HUD server and SSE broadcast daemon."
    allowed_imports:
      - "sdcs.verifier"
      - "sdcs.audit"
      - "sdcs.decay"
      - "sdcs.session"
      - "sdcs.warehouse"
      - "sdcs.map"

  audit:
    path: "src/sdcs/audit.py"
    description: "Cryptographic eval fixture integrity and SHA-256 auditor."
    allowed_imports: []

  init:
    path: "src/sdcs/init.py"
    description: "Deterministic 7-pillar scaffolding initializer."
    allowed_imports: []

  graph:
    path: "src/sdcs/graph.py"
    description: "Declarative topology transition visualizer."
    allowed_imports: []

  hydrate:
    path: "src/sdcs/hydrate.py"
    description: "Single-pass Turn-1 context compilation engine."
    allowed_imports:
      - "sdcs.map"
      - "sdcs.verifier"
      - "sdcs.warehouse"
      - "sdcs.skeleton"

  map:
    path: "src/sdcs/map.py"
    description: "Cartography drift auditor and synchronizer."
    allowed_imports:
      - "sdcs.init"

sandbox:
  protected_paths:
    - ".env*"
    - "*.pem"
    - "*.key"
    - "dist/**"
  allowed_commands:
    - "pytest"
    - "git"
    - "python"
    - "sdcs"
