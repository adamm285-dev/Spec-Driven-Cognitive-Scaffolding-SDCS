[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdcs"
version = "1.4.1"
description = "Spec-Driven Cognitive Scaffolding (SDCS) - A deterministic cognitive harness for autonomous agentic software engineering."
readme = "README.md"
authors = [
    { name = "Adam Murphy" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "agents",
    "agentic-coding",
    "ai",
    "scaffolding",
    "claude-code",
    "cursor",
    "gemini",
    "autonomous-agents",
    "evals",
    "adr"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "black>=24.0.0",
    "mypy>=1.10.0"
]

[project.scripts]
sdcs = "sdcs.cli:main"
sdcs-init = "sdcs.init:main"
sdcs-audit = "sdcs.audit:main"

[project.urls]
Homepage = "https://github.com/adamm285-dev/Spec-Driven-Cognitive-Scaffolding-SDCS"
Repository = "https://github.com/adamm285-dev/Spec-Driven-Cognitive-Scaffolding-SDCS"
Specification = "https://github.com/adamm285-dev/Spec-Driven-Cognitive-Scaffolding-SDCS/blob/main/SPEC-001.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["EXE001"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
